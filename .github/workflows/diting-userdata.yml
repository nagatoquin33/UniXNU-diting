name: diting userdata

# OS-window rebuild for the prepared 22H374 userland. The full chain (prepared OS +
# SystemOS + Data) is the one run 42073458178 proved on a hosted macos-15-intel
# runner; this workflow uploads only the OS window and the reports, because the
# device keeps its SystemOS and Data windows for the first /diting boot.

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: "IPSW URL (default: board.toml [ipsw] url)"
        required: false
        type: string
      phone_ipsw_url:
        description: "Matching 22H374 iPhone IPSW URL for phone_components18 (keyboard/WiFiKitUI)"
        required: false
        type: string
        default: "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/140-97953/5F3051CD-5405-4FEF-889E-C3B78E0F376F/iPhone11,8_18.7.10_22H374_Restore.ipsw"
      data_mib:
        description: "Data APFS volume size in KiB (default: 33554432 = 32 GiB)"
        required: false
        type: string
        default: "33554432"

permissions:
  contents: read

concurrency:
  group: diting-userdata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  userland:
    runs-on: macos-15-intel
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: false
      - name: reclaim disk
        # Peak is about 37 GiB; the unused Xcode copies go below 80 GiB free.
        run: |
          set -euo pipefail
          selected="$(xcode-select -p)"
          echo "xcode-select: ${selected}"
          need=$((80 * 1024 * 1024))
          avail="$(df -k / | awk 'NR==2 {print $4}')"
          echo "avail_kb=${avail} need_kb=${need}"
          if [ "$avail" -lt "$need" ]; then
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              case "$selected" in
                "$app"/*) echo "keep $app" ;;
                *) echo "remove $app"; sudo rm -rf "$app" ;;
              esac
            done
          fi
          sudo rm -rf /Library/Developer/CoreSimulator/Caches /Library/Developer/CoreSimulator/Devices || true
          rm -rf "$HOME/Library/Developer/CoreSimulator" "$HOME/Library/Developer/Xcode/DerivedData" || true
          df -h
      - name: tools
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          python3 -m pip install --quiet --break-system-packages pyhpke
          ok=1
          for t in hdiutil diskutil aea python3; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          sudo -n true || { echo 'this runner cannot sudo -n, and the userland chain needs it'; ok=0; }
          [ "$ok" = 1 ]
      - name: phone donor components (optional)
        id: phone_donor
        run: |
          set -euo pipefail
          purl="${{ inputs.phone_ipsw_url }}"
          if [ -z "$purl" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/diting-phone-donor"
          mkdir -p "$RUNNER_TEMP/diting-phone-donor/ipsw" "$RUNNER_TEMP/diting-phone-donor/mnt"
          python3 device/scripts/download-ipados18-restore.py \
            --output-dir "$RUNNER_TEMP/diting-phone-donor/ipsw" \
            --jobs 4 --chunk-mib 64 --url "$purl"
          ipsw_path="$(python3 -c "import json; d=json.load(open('$RUNNER_TEMP/diting-phone-donor/ipsw/download-progress.json')); print('$RUNNER_TEMP/diting-phone-donor/ipsw/' + d['image'])")"
          mkdir -p "$RUNNER_TEMP/diting-phone-donor/22H374"
          python3 - "$ipsw_path" "$RUNNER_TEMP/diting-phone-donor/22H374" <<'PY'
          import pathlib, plistlib, sys, zipfile
          ipsw, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(ipsw) as zf:
              raw = zf.read('BuildManifest.plist')
              (out / 'BuildManifest.plist').write_bytes(raw)
              m = plistlib.loads(raw)
              assert (m['ProductVersion'], m['ProductBuildVersion']) == ('18.7.10', '22H374'), m['ProductBuildVersion']
              os_rel = m['BuildIdentities'][0]['Manifest']['OS']['Info']['Path']
              dest = out / pathlib.Path(os_rel).name
              with zf.open(os_rel) as src, dest.open('wb') as dst:
                  while chunk := src.read(8 << 20):
                      dst.write(chunk)
              print('extracted', dest)
          PY
          rm -rf "$RUNNER_TEMP/diting-phone-donor/ipsw"
          os_aea="$(find "$RUNNER_TEMP/diting-phone-donor/22H374" -name '*.dmg.aea' | head -n 1)"
          manifest="$(find "$RUNNER_TEMP/diting-phone-donor/22H374" -name 'BuildManifest.plist' | head -n 1)"
          python3 device/scripts/decrypt-ipados18-aea.py \
            --input "$os_aea" \
            --output "$RUNNER_TEMP/diting-phone-donor/phone-os.dmg"
          rm -f "$os_aea"
          plist_out="$(hdiutil attach "$RUNNER_TEMP/diting-phone-donor/phone-os.dmg" -readonly -nobrowse -mountrandom "$RUNNER_TEMP/diting-phone-donor/mnt" -plist)"
          dev="$(python3 -c "import plistlib,sys; p=plistlib.loads(sys.stdin.buffer.read()); print(next(e['dev-entry'] for e in p['system-entities'] if e.get('mount-point')))" <<< "$plist_out")"
          root="$(python3 -c "import plistlib,sys; p=plistlib.loads(sys.stdin.buffer.read()); print(next(e['mount-point'] for e in p['system-entities'] if e.get('mount-point') and __import__('pathlib').Path(e['mount-point'], 'System/Library/CoreServices/SystemVersion.plist').is_file()))" <<< "$plist_out")"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          df -h
      - name: prepared userland
        id: userland
        run: |
          set -euo pipefail
          url="${{ inputs.ipsw_url }}"
          if [ -z "$url" ]; then
            url="$(python3 -c "import tomllib; print(tomllib.load(open('device/board.toml','rb'))['ipsw']['url'])")"
          fi
          case "$url" in
            https://*) ;;
            *) echo "ipsw_url must be an https URL, got: ${url}" >&2; exit 1 ;;
          esac
          rm -rf "$RUNNER_TEMP/diting-userland" "$RUNNER_TEMP/diting-ipsw-work"
          extra=()
          if [ "${{ steps.phone_donor.outputs.enabled }}" = "true" ]; then
            extra+=(--phone-donor-root "${{ steps.phone_donor.outputs.root }}" --phone-manifest "${{ steps.phone_donor.outputs.manifest }}")
          fi
          python3 device/scripts/prepare-diting-userland-from-ipsw.py \
            --ipsw-url "$url" \
            --work-dir "$RUNNER_TEMP/diting-ipsw-work" \
            --out "$RUNNER_TEMP/diting-userland" \
            --developer "$(xcode-select -p)" \
            --json-out "$RUNNER_TEMP/diting-userland/report.json" \
            --volume-layout-out "$RUNNER_TEMP/diting-userland/volume-layout.json" \
            --data-mib "${{ inputs.data_mib }}" \
            --jobs 4 \
            "${extra[@]}"
          df -h
      - name: cleanup phone donor
        if: always() && steps.phone_donor.outputs.enabled == 'true'
        run: |
          hdiutil detach "${{ steps.phone_donor.outputs.dev }}" || true
          rm -rf "$RUNNER_TEMP/diting-phone-donor" || true
      - uses: actions/upload-artifact@v4
        with:
          name: diting-os-window
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/diting-userland/diting-ipados18-system.cdr
            ${{ runner.temp }}/diting-userland/diting-ipados18-data.packed
            ${{ runner.temp }}/diting-userland/report.json
            ${{ runner.temp }}/diting-userland/volume-layout.json
            ${{ runner.temp }}/diting-userland/apply-complete.json
