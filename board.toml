schema_version = 2

[board]
name = "diting"
soc = "SM8475"
soc_source = "sm8475"
# The 22H374 profile ships in this repository at os-profiles/ and is installed into the
# UniXNU checkout before resolving (scripts/install-unixnu-inputs.py). The copy is
# byte-identical to UniXNU/profiles/os/ipados-18.7.10-22H374 today; it predates upstream.
os_profile = "ipados-18.7.10-22H374"
description = "Redmi K50 Ultra (diting/SM8475): UniXNU bring-up from the Diting baseline"
kit = "diting"

# iPadOS 18.7.10 restore selected from the matching J171 BuildIdentity.
[ipsw]
url = "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/140-97955/A3F72236-89AD-47C5-8394-5E824079C175/iPad_10.2_18.7.10_22H374_Restore.ipsw"
product = "iPad7,11"
version = "18.7.10"
build = "22H374"
device_class = "j171ap"
chip_id = 0x8010
board_id = 0x1c
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemOS", "Cryptex1,SystemTrustCache", "Cryptex1,AppOS", "Cryptex1,AppTrustCache", "OS"]

# Pins for members whose fetched bytes we hold locally (hashes computed
# 2026-11-13 from the matching J171 restore). KernelCache/OS/SystemOS/AppOS
# stay unpinned: the local copies are decompressed/extracted artifacts, not
# the raw fetch members (see migration-state image_hashes_used=false).
[ipsw.sha256]
DeviceTree = "acf9c6110f7c65936f72cc606a858f2f8008ac153d19bb4488e9ef767d1ffa01"
StaticTrustCache = "61ce2dc95d72d33f19dcff3de858e4001742593d728239d205e3669794bcebc2"

[components]
# This is the community Diting A730/QCA6490/Darwin24 implementation, not the A740/WCN7850 source.
# The kit lives in this repository at kits/DitingPlatform24 and declares no archive recipe: the
# kernel step of this board builds the aggregate itself, see [kernel] below.
include = ["DitingPlatform24", "XnuPrelink"]

[device_tree]
source = "device:dts/diting.dts"
include_dirs = ["soc:dts"]

[kernel]
defconfig = "diting_ipados18_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8475.config", "os:configs/ipados.config"]
patch_series = ["device:migration/format2/arch-darwin24.series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu-ipados18/series"]
# Explicitly empty: an array here replaces the arch profile's list, and its
# archive builders produce the BCM2837 providers, not this board's aggregate.
archives = []
# The Darwin 24 aggregate is compiled with MACHINE_CONFIGS=DITING (config/MASTER.arm64.diting, added
# by patches/xnu-ipados18), not with the BCM2837 machine config the shared kernel step used to
# select for every board. The kernel step passes this value through as XNU_MACHINE_CONFIG and
# takes its object directory and aggregate name from it.
machine_config = "DITING"
# 由组件配方生成完整内核，避免通用引导步骤先选择其他机器配置。
builder_component = "DitingPlatform24"

# Local prelink and userdata entries are documented under migration/ipados18.
[kernel.prelink]
# The native aggregate the recipe leaves at this path, and the prelinker this
# board carried before the format 2 rewrite.
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_DITING/mach.development.diting"
# 22H374 的原始预链接基址为 0xfffffff005130000；存储绑定使用
# 0xfffffff00b000000。最终内核还需通过存储绑定落段检查。
slide = "0x5ed0000"
roots = ["com.apple.kec.corecrypto", "com.apple.kec.pthread", "com.apple.filesystems.apfs",
         "com.apple.kec.Compression", "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib"]

[adt.root.string]
model = "iPhone17,1"
target-type = "J171"
target-sub-type = "J171AP"
"diting,physical-model" = "Xiaomi Redmi K50 Ultra"

[adt.root.strings]
compatible = ["J171AP", "iPhone17,1", "qcom,sm8475"]

[adt.product.string]
product-name = "iPhone 16 Pro"
product-description = "iPhone 16 Pro"
artwork-device-idiom = "phone"
artwork-dynamic-displaymode = "0"
artwork-display-gamut = "sRGB"
compatible-device-fallback = "iPhone17,1"
compatible-app-variant = "0"

[adt.product.u32]
artwork-device-subtype = 2622
device-perf-memory-class = 3
thin-bezel = 1
allow-32bit-apps = 0
ephemeral-data-mode = 0
udid-version = 1
artwork-scale-factor = 3

[adt.defaults.u32]
sleep-disabled = 1

[adt.arm-io.diting-touch.string]
compatible = "diting,goodix-berlin-d"

[adt.arm-io.diting-touch.u64]
spi-base = 0x990000
tlmm-base = 0xf000000
gcc-base = 0x100000
rsc-base = 0x17a20000
cmd-db-base = 0x80860000

[adt.arm-io.diting-touch.u32]
gpio-offset = 0x100000
max-x = 0x2fa8
max-y = 0x69f0

[adt.arm-io.diting-touch.bytes]
pins = "100000001100000012000000130000001500000014000000"

[adt.arm-io.diting-buttons.string]
compatible = "diting,pm8350-keys"

[adt.arm-io.diting-buttons.u64]
core-base = 0xc400000
cnfg-base = 0xc42d000
observer-base = 0xc440000

[adt.arm-io.diting-buttons.u32]
ee = 0
pon-ppid = 0x13
volume-up-ppid = 0x18d

[adt.arm-io.ufshc.u64]
"diting,ufs-hc-base" = 0x1d84000
"diting,ufs-hc-size" = 0x3000
"diting,gcc-ufs-page" = 0x187000
"diting,smmu-base" = 0x15000000
"diting,smmu-size" = 0x100000
"unixnu,userdata-first-lba" = 0x2f8a00
"unixnu,userdata-last-lba" = 0x3adf3fa

[adt.arm-io.ufshc.u32]
"diting,smmu-stream-id" = 0xe0
"diting,smmu-context-banks" = 0x4e
"diting,smmu-match-groups" = 0x78
"diting,ufs-spi" = 0x109

[adt.chosen.u32]
display-scale = 3
display-rotation = 0

[adt.chosen.bytes]
# DarwinBoot fills this zero template at boot (32-byte header + 64 x 16-byte ranges).
darwinboot-memory-ranges = ""
diting-allocatable-ram = ""
diting-audio-dma = "00000000000000000000000000000000"
diting-panel-pool = "00000000000000000000000000000000"
diting-dsi-backlight = "0040e90a0000000000040000ff0f000001000000010000000000000001000000"

[adt.buttons.strings]
button-names = ["volup", "voldown", "hold"]

[adt.buttons.u32]
home-button-type = 2
opposed-power-vol-buttons = 1

[firmware]
config = "diting"
dsc = "Platforms/Xiaomi/ditingPkg/diting.dsc"
fd = "Build/ditingPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
# Runs in the build tree before the firmware build and writes the device tree the boot image
# carries; [bootimg] dtb names the same path.
preflight = ["scripts/build-diting-hardware-dtb.py"]
patches = [
  "Resources/MuPatches/AsmMacroLib.patch",
  "Resources/MuPatches/Auth-Service.patch",
  "Resources/MuPatches/Boot-Manager.patch",
  "Resources/MuPatches/Timer.patch",
  "Resources/MuPatches/Usb-Bus.patch",
]
# The firmware volume builds from these checkouts; with the CI checkout not recursive,
# the core initializes exactly this list before EDK II runs.
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI",
              "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Platforms/Xiaomi",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
DEVICE_MODEL = "0"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "UniXNU-Diting"
DITING_INITRD_DISK_ENABLED = "1" # Set 0 to isolate SEC/HOB without the disk DXE.

[payload]
tools = true
# The DarwinBoot loader is part of the firmware volume; explicit for the official schema
# (docs/zh/reference/configuration.md [payload] loader).
loader = "firmware"
# The boot menu entry the firmware's DarwinBoot lists first, and the volume label of payload.img.
title = "Diting iPadOS 18.7.10"
volume = "UNIXNU"
# 96 MiB, the --fat-mib a local run packs: DitingBootMemoryDxe refuses an initrd
# above DITING_FAT_MAX_INITRD (128 MiB), and the 4096-byte PONGFAT1 header is
# inside the payload image the package step repacks, so the volume stays well
# below that bound.
size_mib = 96
# The runtime arguments this board brings up with: the command line extracted from the
# working addon18 image, verbatim (deduped by name, so a later same-name entry would
# replace the earlier one at its position). DarwinBoot copies the line into a
# 1024-byte buffer and refuses more than 1000 bytes; keep the assembled line within
# 1023 bytes.
kernel_args = [
  "-v",
  "keepsyms=1",
  "cpus=8",
  "diting_allow_unauthenticated_root=1",
  "cs_enforcement_disable=1",
  "cs_library_val_enable=0",
  "amfi_get_out_of_my_way=1",
  "-apfs_shared_datavolume",
  "debug=0x14e",
  "serial=0",
  "diting_disable_swap=1",
  "diting_skip_setup=1",
  "diting_adsp=2",
  "diting_audio=2",
  "diting_ufs_readwrite=1",
  "diting_ufs_stall=0",
  "diting_wifi=1",
  "ignition_level=1",
  "dyld_flags=0x8",
  "launchd_rd=md0",
  "launchd_unsecure_cache=1",
  "diting_init_trace=1",
  "diting_exec_diag=1",
  "applog=1",
  "applog_name=launchd,backboardd,SpringBoard,containermanagerd,lsd,runningboardd,logd_helper,powerd",
  "diting_software_keybag=1",
  "diting_display=1",
  "diting_software_ui=0",
  "diting_ui_software=0",
  "diting_touch=1",
  "diting_buttons=1",
  "diting_build=ipados18-22H374",
  "diting_gpu_scanout=1",
  "diting_gpu_pool_mib=256",
  "diting_metal_global=1",
  "diting_gpu_lock_max=1",
  "diting_usb=0",
  "diting_usb_mux=1",
  "diting_usb_iphone=1",
  "diting_rootful=1",
  "diting_console_pause=0",
  "diting_data_reserve=4",
  "diting_ramoops_ufs=1",
  "diting_adreno_start=1",
  "diting_metal=1",
  "gpu-addon=1",
  "diting_adsp-fw=/private/var/ngpu/firmware",
]

[payload.runtime]
# Official pre-kernel runtime hook (docs/zh/reference/configuration.md): IPSW trust modules,
# source-built GPU/audio addons and the first-install Data seed. Diting's userland predates this
# builder and its GPU addon is packaged by scripts/build-release-image-linux.py today, so the hook
# stays disabled - the same behavior as the section being absent - until a Diting runtime tool
# replaces that path.
enabled = false

[payload.adt]
# [payload.adt] tool stays unset: the official payload step runs
# `<tool> --output ... --dram-size ...`, while the Diting generator
# (scripts/finalize-diting-adt.py) has a different CLI and also writes the v4 boot
# container; align that CLI before enabling the official payload step.
# schema_version 2 builds the ADT from the hardware DTS through devicetree.generate(); these keys
# are the ones that function reads from [payload.adt]. The DarwinBoot allocation window is 4 GiB,
# the window the first bring-up boot used.
owned_memory_size = "0x100000000"
# The restore's own disk images are used unmodified, so /chosen/RAMDisk holds only the seed; the
# three volumes come from the userdata image and XNU mounts them through the UFS root driver.
packed_data_ramdisk = false
# The seed is not stored in any repository: scripts/package.sh takes it from UNIXNU_UNIQUE_CHIP_ID.
unique_chip_id = "required"
# The J171 BuildIdentity's chip ID, the same value [ipsw] carries.
chip_id = "0x8010"

[userdata]
# The userdata partition this board installs into, in 4 KiB sectors: the geometry
# scripts/install-diting-ufs-data.py and scripts/prepare-ipados18-ufs-layout.py check
# against. Measured on this unit over adb on 2026-11-06:
#   /dev/block/by-name/userdata -> /dev/block/sda37
#   /sys/class/block/sda37/start = 24924160 (512-byte sectors) = 3115520 4K
#   /sys/class/block/sda37/size  = 468930520 (512-byte sectors) = 58616315 4K
#   240,092,426,240 bytes = 223.6 GiB; sda queue logical_block_size = 4096
# The values this table carried before were inherited from the Diting baseline.
first_lba = 0x2F8A00
last_lba = 0x3ADF3FA
lba_bytes = 4096
# The windows of the userdata image are the OS and SystemOS disk images of the IPSW, in
# that order; the OS profile lists them ([userdata] windows of
# os-profiles/ipados-18.7.10-22H374/profile.toml), because they are the profile's
# components. This table adds only what belongs to the device.

[package]
# The UniXNU checkout, relative to this repository: scripts/package.sh reads it.
unixnu = "../UniXNU"

[package.defconfig]
"ipados-18.7.10-22H374" = "diting_ipados18_defconfig"

[bootimg]
# Compiled by scripts/build-diting-hardware-dtb.py at the firmware preflight step, relative to the
# build tree (docs/porting/packaging.md).
dtb = "build/diting/diting.dtb"

[bootimg.image]
# Resources/Configs/diting.toml in the firmware records the Android build system's v4, but unixnu
# packs and verifies v0-v2 headers only: verify() reads header_version and pagesize at the v0/v1/v2
# offsets and a v4 header carries them elsewhere. This header therefore describes boot/boot.img,
# the spec product whose ramdisk is the bare payload.img. The flashable v4 image the firmware
# accepts is boot/diting-xnu-initial.img, written by scripts/finalize-diting-adt.py with the same
# container the local flow produces; see the payload section above.
header_version = 0
pagesize = 4096
